# Sourcery AI Configuration for SAGE-OS
# Automated code review and quality improvements

# Project settings
project_name: "SAGE-OS"
description: "Self-Aware General Environment Operating System"

# Code quality rules
rules:
  # Enable all default rules
  default: true
  
  # Custom rules for embedded systems
  embedded_systems:
    - no-dynamic-allocation
    - prefer-static-arrays
    - check-buffer-bounds
    - validate-pointer-arithmetic
    - memory-leak-detection
    
  # Security rules
  security:
    - buffer-overflow-check
    - integer-overflow-check
    - format-string-validation
    - input-sanitization
    - privilege-escalation-check
    
  # Performance rules
  performance:
    - loop-optimization
    - memory-access-patterns
    - cache-efficiency
    - branch-prediction
    - inline-function-suggestions

# File patterns to analyze
include:
  - "**/*.c"
  - "**/*.h"
  - "**/*.cpp"
  - "**/*.hpp"
  - "**/*.py"
  - "**/*.rs"
  - "**/*.S"
  - "**/*.s"
  - "**/*.asm"

# File patterns to exclude
exclude:
  - "build/**"
  - "output/**"
  - "test-output/**"
  - "*.img"
  - "*.elf"
  - "*.bin"
  - "*.o"
  - "*.a"
  - "docs/build/**"
  - "node_modules/**"
  - ".git/**"

# Language-specific settings
languages:
  c:
    # C-specific rules for kernel development
    rules:
      - kernel-coding-style
      - no-floating-point
      - stack-usage-check
      - interrupt-safety
      - atomic-operations
    standards:
      - "C99"
      - "MISRA-C:2012"
    
  python:
    # Python rules for build scripts and tools
    rules:
      - pep8-compliance
      - type-hints
      - docstring-coverage
      - security-best-practices
    version: "3.11+"
    
  rust:
    # Rust rules for prototype development
    rules:
      - memory-safety
      - thread-safety
      - error-handling
      - performance-optimization
    edition: "2021"

# Review settings
review:
  # Auto-approve simple fixes
  auto_approve:
    - style-fixes
    - documentation-improvements
    - simple-refactoring
    
  # Require manual review for
  manual_review:
    - security-changes
    - memory-management
    - interrupt-handlers
    - boot-code
    - kernel-core
    
  # Comment settings
  comments:
    # Add explanatory comments for complex suggestions
    explain_complex: true
    # Include performance impact estimates
    performance_impact: true
    # Include security implications
    security_notes: true

# Integration settings
integrations:
  github:
    # Enable GitHub integration
    enabled: true
    # Create pull request reviews
    pull_request_reviews: true
    # Add status checks
    status_checks: true
    # Label pull requests
    labels:
      - "code-quality"
      - "automated-review"
      - "sourcery"
    
  # CI/CD integration
  ci_cd:
    # Run on all commits
    on_commit: true
    # Run on pull requests
    on_pull_request: true
    # Fail build on critical issues
    fail_on_critical: true

# Metrics and reporting
metrics:
  # Track code quality metrics
  quality_score: true
  # Track technical debt
  technical_debt: true
  # Track security score
  security_score: true
  # Generate reports
  reports:
    - weekly_summary
    - monthly_detailed
    - security_audit

# Custom checks for SAGE-OS
custom_checks:
  # Embedded systems specific
  embedded:
    - name: "stack-usage"
      description: "Check stack usage in functions"
      pattern: "recursive calls or large local arrays"
      severity: "warning"
      
    - name: "interrupt-context"
      description: "Validate interrupt handler safety"
      pattern: "functions called from interrupt context"
      severity: "error"
      
    - name: "memory-barriers"
      description: "Check for proper memory barriers"
      pattern: "shared memory access without barriers"
      severity: "warning"
      
  # AI subsystem specific
  ai_subsystem:
    - name: "ai-safety"
      description: "Check AI subsystem safety measures"
      pattern: "AI decision points without safety checks"
      severity: "error"
      
    - name: "model-validation"
      description: "Validate AI model inputs"
      pattern: "unvalidated inputs to AI models"
      severity: "warning"

# Notification settings
notifications:
  # Notify on critical issues
  critical_issues: true
  # Daily summary
  daily_summary: false
  # Weekly report
  weekly_report: true
  # Security alerts
  security_alerts: true

# Learning and adaptation
learning:
  # Learn from code patterns
  pattern_learning: true
  # Adapt to project style
  style_adaptation: true
  # Improve suggestions over time
  suggestion_improvement: true