name: 📦 Dependency Management & Security

on:
  schedule:
    # Run dependency checks daily at 6 AM UTC
    - cron: '0 6 * * *'
  push:
    branches: [dev, main]
    paths:
      - '**/requirements.txt'
      - '**/Cargo.toml'
      - '**/package.json'
      - '**/CMakeLists.txt'
      - '.github/dependabot.yml'
  pull_request:
    paths:
      - '**/requirements.txt'
      - '**/Cargo.toml'
      - '**/package.json'
      - '**/CMakeLists.txt'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write

jobs:
  dependency-audit:
    name: 🔍 Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    strategy:
      matrix:
        ecosystem: [python, rust, npm, docker]
        
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python (for all ecosystems)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: 📦 Install Security Tools
      run: |
        pip install --upgrade pip
        pip install safety bandit semgrep pip-audit
        
    - name: 🔍 Python Dependency Audit
      if: matrix.ecosystem == 'python'
      run: |
        echo "🐍 Auditing Python dependencies..."
        
        # Create reports directory
        mkdir -p reports/dependencies/python
        
        # Check all requirements.txt files
        find . -name "requirements.txt" -type f | while read req_file; do
          echo "📋 Checking $req_file"
          
          # Safety check for known vulnerabilities
          safety check -r "$req_file" --json > "reports/dependencies/python/safety-$(basename $(dirname $req_file)).json" || true
          
          # pip-audit for additional security checks
          pip-audit -r "$req_file" --format=json --output="reports/dependencies/python/pip-audit-$(basename $(dirname $req_file)).json" || true
        done
        
        # Generate summary
        echo "# 🐍 Python Dependency Security Report" > reports/dependencies/python/summary.md
        echo "" >> reports/dependencies/python/summary.md
        echo "**Generated:** $(date)" >> reports/dependencies/python/summary.md
        echo "**Workflow:** ${{ github.workflow }}" >> reports/dependencies/python/summary.md
        echo "" >> reports/dependencies/python/summary.md
        
        # Count vulnerabilities
        vuln_count=$(find reports/dependencies/python -name "*.json" -exec jq -r '.vulnerabilities[]?' {} \; 2>/dev/null | wc -l || echo "0")
        echo "**Vulnerabilities Found:** $vuln_count" >> reports/dependencies/python/summary.md
        
    - name: 🦀 Rust Dependency Audit
      if: matrix.ecosystem == 'rust'
      run: |
        echo "🦀 Auditing Rust dependencies..."
        
        # Install cargo-audit
        cargo install cargo-audit
        
        mkdir -p reports/dependencies/rust
        
        # Check Cargo.toml files
        find . -name "Cargo.toml" -type f | while read cargo_file; do
          echo "📋 Checking $cargo_file"
          cd "$(dirname $cargo_file)"
          
          # Run cargo audit
          cargo audit --json > "../../reports/dependencies/rust/audit-$(basename $(pwd)).json" || true
          cd - > /dev/null
        done
        
        # Generate summary
        echo "# 🦀 Rust Dependency Security Report" > reports/dependencies/rust/summary.md
        echo "" >> reports/dependencies/rust/summary.md
        echo "**Generated:** $(date)" >> reports/dependencies/rust/summary.md
        
    - name: 📦 NPM Dependency Audit
      if: matrix.ecosystem == 'npm'
      run: |
        echo "📦 Auditing NPM dependencies..."
        
        # Install Node.js
        curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
        sudo apt-get install -y nodejs
        
        mkdir -p reports/dependencies/npm
        
        # Check package.json files
        find . -name "package.json" -type f | while read pkg_file; do
          echo "📋 Checking $pkg_file"
          cd "$(dirname $pkg_file)"
          
          # Run npm audit
          npm audit --json > "../../reports/dependencies/npm/audit-$(basename $(pwd)).json" || true
          cd - > /dev/null
        done
        
        # Generate summary
        echo "# 📦 NPM Dependency Security Report" > reports/dependencies/npm/summary.md
        echo "" >> reports/dependencies/npm/summary.md
        echo "**Generated:** $(date)" >> reports/dependencies/npm/summary.md
        
    - name: 🐳 Docker Security Scan
      if: matrix.ecosystem == 'docker'
      run: |
        echo "🐳 Scanning Docker dependencies..."
        
        mkdir -p reports/dependencies/docker
        
        # Scan all Dockerfiles
        find . -name "Dockerfile*" -type f | while read dockerfile; do
          echo "📋 Scanning $dockerfile"
          
          # Use hadolint for Dockerfile linting
          docker run --rm -i hadolint/hadolint < "$dockerfile" > "reports/dependencies/docker/hadolint-$(basename $dockerfile).txt" || true
        done
        
        # Generate summary
        echo "# 🐳 Docker Security Report" > reports/dependencies/docker/summary.md
        echo "" >> reports/dependencies/docker/summary.md
        echo "**Generated:** $(date)" >> reports/dependencies/docker/summary.md
        
    - name: 📤 Upload Dependency Reports
      uses: actions/upload-artifact@v4
      with:
        name: dependency-audit-${{ matrix.ecosystem }}
        path: reports/dependencies/${{ matrix.ecosystem }}/
        retention-days: 30

  vulnerability-summary:
    name: 📊 Vulnerability Summary
    runs-on: ubuntu-latest
    needs: dependency-audit
    if: always()
    
    steps:
    - name: 📥 Download All Reports
      uses: actions/download-artifact@v4
      with:
        path: all-reports/
        
    - name: 📊 Generate Comprehensive Summary
      run: |
        echo "📊 Generating comprehensive vulnerability summary..."
        
        mkdir -p final-reports
        
        # Create comprehensive summary
        cat > final-reports/vulnerability-summary.md << 'EOF'
        # 🛡️ SAGE-OS Dependency Security Summary
        
        **Generated:** $(date)
        **Workflow:** ${{ github.workflow }}
        **Run ID:** ${{ github.run_id }}
        
        ## 📊 Security Overview
        
        This report provides a comprehensive overview of dependency security across all ecosystems in SAGE-OS.
        
        ### 🎯 Ecosystems Analyzed
        - 🐍 **Python**: Build scripts, AI integration, tools
        - 🦀 **Rust**: Prototype development
        - 📦 **NPM**: Documentation and web tools
        - 🐳 **Docker**: Containerized build environments
        
        ### 🔍 Security Tools Used
        - **Safety**: Python vulnerability database
        - **pip-audit**: Python package auditing
        - **cargo-audit**: Rust security advisory database
        - **npm audit**: NPM vulnerability scanner
        - **hadolint**: Dockerfile security linting
        
        ## 📈 Recommendations
        
        1. **Regular Updates**: Keep dependencies updated with Dependabot
        2. **Security Monitoring**: Monitor security advisories
        3. **Minimal Dependencies**: Use only necessary dependencies
        4. **Version Pinning**: Pin versions for reproducible builds
        5. **Security Reviews**: Review dependency changes in PRs
        
        EOF
        
        # Count total vulnerabilities across all ecosystems
        total_vulns=0
        for ecosystem in python rust npm docker; do
          if [ -d "all-reports/dependency-audit-$ecosystem" ]; then
            ecosystem_vulns=$(find "all-reports/dependency-audit-$ecosystem" -name "*.json" -exec jq -r '.vulnerabilities[]?' {} \; 2>/dev/null | wc -l || echo "0")
            echo "- **$ecosystem**: $ecosystem_vulns vulnerabilities" >> final-reports/vulnerability-summary.md
            total_vulns=$((total_vulns + ecosystem_vulns))
          fi
        done
        
        echo "" >> final-reports/vulnerability-summary.md
        echo "**Total Vulnerabilities:** $total_vulns" >> final-reports/vulnerability-summary.md
        
        # Set security status
        if [ $total_vulns -eq 0 ]; then
          echo "🟢 **Security Status:** GOOD - No known vulnerabilities" >> final-reports/vulnerability-summary.md
        elif [ $total_vulns -lt 5 ]; then
          echo "🟡 **Security Status:** MODERATE - Few vulnerabilities found" >> final-reports/vulnerability-summary.md
        else
          echo "🔴 **Security Status:** ATTENTION NEEDED - Multiple vulnerabilities found" >> final-reports/vulnerability-summary.md
        fi
        
    - name: 📤 Upload Final Summary
      uses: actions/upload-artifact@v4
      with:
        name: vulnerability-summary-report
        path: final-reports/
        retention-days: 90
        
    - name: 💬 Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          if (fs.existsSync('final-reports/vulnerability-summary.md')) {
            const summary = fs.readFileSync('final-reports/vulnerability-summary.md', 'utf8');
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🛡️ Dependency Security Report\n\n${summary}\n\n---\n*Automated security analysis*`
            });
          }

  dependency-graph:
    name: 📈 Dependency Graph Generation
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: 📊 Generate Dependency Graph
      run: |
        pip install pipdeptree pydeps
        
        mkdir -p reports/dependency-graphs
        
        # Generate Python dependency trees
        find . -name "requirements.txt" -type f | while read req_file; do
          echo "📊 Generating dependency graph for $req_file"
          
          # Install dependencies temporarily
          pip install -r "$req_file" || true
          
          # Generate dependency tree
          pipdeptree --json > "reports/dependency-graphs/$(basename $(dirname $req_file))-deps.json"
          pipdeptree > "reports/dependency-graphs/$(basename $(dirname $req_file))-deps.txt"
        done
        
    - name: 📤 Upload Dependency Graphs
      uses: actions/upload-artifact@v4
      with:
        name: dependency-graphs
        path: reports/dependency-graphs/
        retention-days: 30